name: Ranked Deal + 60s Discord Monitor

on:
  # 원본 Vans ZIP의 cron 표현식을 한 글자도 바꾸지 않았습니다. (UTC 기준)
  schedule:
    - cron: "51 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      probe_only:
        description: "쇼핑몰 API 접근 확인만 수행하고 Discord 알림 감시 생략"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - name: Cancel older scheduled monitoring runs
        if: ${{ inputs.probe_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: monitor.yml
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh run list --repo "${GH_REPO}" --workflow "${WORKFLOW_FILE}" --status "${status}" --limit 50 --json databaseId,event \
              --jq '.[] | select(.event == "schedule") | .databaseId' | while read -r run_id; do
              if [ -z "${run_id}" ] || [ "${run_id}" = "${CURRENT_RUN_ID}" ]; then
                continue
              fi
              echo "Canceling older scheduled run: ${run_id}"
              gh run cancel "${run_id}" --repo "${GH_REPO}" || true
            done
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Install Chromium for ranking discovery and probe
        run: |
          if python -c 'import json,sys; c=json.load(open("config/monitor.json")); sys.exit(0 if c.get("discovery",{}).get("enabled",True) else 1)'; then
            python -m playwright install --with-deps chromium
          fi

      - name: Diagnose ranking and product APIs
        if: ${{ inputs.probe_only == true }}
        run: python deal_monitor.py --probe

      - name: Check historical ranked deals every 60 seconds
        if: ${{ inputs.probe_only != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          USD_KRW_RATE: ${{ secrets.USD_KRW_RATE }}
          CHECK_INTERVAL_SECONDS: "60"
          SITE_BLOCK_BACKOFF_SECONDS: "900"
          RUN_DURATION_SECONDS: "21480"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: python deal_monitor.py --loop --git-sync
